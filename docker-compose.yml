version: '3.8'

services:
  # Frontend - Nginx serving React build with API proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: bayarcash-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bayarcash-network

  # Backend - Node.js Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bayarcash-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-bayarcash123}
      - DB_NAME=${DB_NAME:-ghl_bayarcash}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI:-https://bayarcash.kodekreatif.com/api/oauth/callback}
      - FRONTEND_URL=${FRONTEND_URL:-https://bayarcash.kodekreatif.com}
      - BACKEND_URL=${BACKEND_URL:-https://bayarcash.kodekreatif.com/api}
      - GHL_TOKEN_URL=${GHL_TOKEN_URL:-https://services.leadconnectorhq.com/oauth/token}
      - BAYARCASH_API_URL_PRODUCTION=${BAYARCASH_API_URL_PRODUCTION:-https://api.bayar.cash}
      - BAYARCASH_API_URL_SANDBOX=${BAYARCASH_API_URL_SANDBOX:-https://api.console.bayar.cash}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bayarcash-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: bayarcash-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-bayarcash123}
      - MYSQL_DATABASE=${DB_NAME:-ghl_bayarcash}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-bayarcash123}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bayarcash-network

networks:
  bayarcash-network:
    driver: bridge

volumes:
  mysql_data:
