# Docker Compose untuk LOCAL TESTING sahaja
# Untuk production deployment di Dokploy, guna docker-compose.yml

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: bayarcash_mysql_local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ghl_bayarcash
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data_local:/var/lib/mysql
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "3307:3306"  # Port 3307 untuk avoid conflict
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - bayarcash_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bayarcash_backend_local
    restart: unless-stopped
    environment:
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:3001/oauth/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
      PORT: 3000
      NODE_ENV: development
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      DB_NAME: ghl_bayarcash
      GHL_TOKEN_URL: https://services.leadconnectorhq.com/oauth/token
    ports:
      - "3001:3000"  # Port 3001 untuk avoid conflict dengan Dokploy
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bayarcash_network

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: bayarcash_frontend_local
    restart: unless-stopped
    ports:
      - "8080:80"  # Port 8080 untuk frontend
    depends_on:
      - backend
    networks:
      - bayarcash_network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bayarcash_phpmyadmin_local
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - "8081:80"  # Port 8081 untuk phpMyAdmin
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bayarcash_network

networks:
  bayarcash_network:
    driver: bridge

volumes:
  mysql_data_local:
    driver: local
